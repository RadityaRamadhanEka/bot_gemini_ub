<body>
  <main id="slide"></main>
  <script>
    const slides = [{"layout": "cover", "art_direction": "cinematic-study", "character_frame": "hero-right", "title": "Bingung Mau Kerjain Tugas Dulu atau Review Materi?", "swipe": "Swipe buat tahu caranya"}, {"layout": "problem", "art_direction": "pattern-story", "character_frame": "thinking-center", "items": ["Mau review materi kelas tadi pagi, tapi tugas minggu lalu belum beres.", "Mau ngerjain tugas, tapi materinya belum sempat dipelajari."], "note": "Akhirnya malah procrastinating dan sistem kebut semalam. Relate?", "swipe": "Swipe buat lanjut ke solusi"}, {"layout": "matrix", "art_direction": "blueprint", "character_frame": "none", "quadrants": [["KERJAKAN", "Penting dan mendesak"], ["JADWALKAN", "Penting, belum mendesak"], ["DELEGASIKAN", "Mendesak, kurang penting"], ["BATASI", "Tidak mendesak dan kurang penting"]], "note": "Pakai matriks sebagai panduan awal, lalu sesuaikan dengan kondisi dan tenggatmu.", "swipe": "Swipe buat coba prompt-nya"}, {"layout": "prompt", "art_direction": "paper-note", "character_frame": "sticker-left", "prompt": "Bantu saya menyusun matriks jadwal belajar mingguan berbasis Prioritas Eisenhower berdasarkan daftar 4 mata kuliah ini: [Sebutkan 4 Matkul & Deadline Tugasnya]. Alokasikan waktu fokus 90 menit per sesi dan sertakan jeda istirahat serta kegiatan organisasi kampus setiap sore/malam.", "note": "Tambahkan jam kuliah dan waktu paling produktifmu.", "swipe": "Swipe untuk lihat contoh jadwal"}, {"layout": "planner", "art_direction": "desk-planner", "character_frame": "mentor-corner", "events": [["SENIN", "15.30", "Tugas Analisis Data"], ["SENIN", "17.00", "Istirahat + rapat organisasi"], ["SELASA", "09.00", "Review materi kuliah"], ["SELASA", "MALAM", "Waktu bebas / hobi"]], "note": "Contoh ilustratif. Sesuaikan jadwal dengan kuliah dan kegiatanmu.", "swipe": "Swipe buat rangkumannya"}, {"layout": "closing", "art_direction": "warm-editorial", "character_frame": "portrait-hero", "cta": "Simpan postingan ini untuk dicoba di awal minggu!", "swipe": "Gemini Academy UB"}];
    const index = Math.max(0, Math.min(slides.length - 1,
      Number(new URLSearchParams(location.search).get("slide") || 0)));
    const s = slides[index];
    const esc = value => String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[char]));
    const root = document.querySelector("#slide");
    const header = `<span class="page-no">${String(index + 1).padStart(2, "0")}/${String(slides.length).padStart(2, "0")}</span>
      <div class="brand"><img src="file:///D:/ADIT%20KULIAH/LIMAAA/PROJECT/REFO%20-%20GSA/bot_gemini_ub/referensi_design_carousel/brand-assets/Gemini%20Icon%402x-8.png"><img class="logo" src="file:///D:/ADIT%20KULIAH/LIMAAA/PROJECT/REFO%20-%20GSA/bot_gemini_ub/referensi_design_carousel/brand-assets/Gemini%20Academy%20Logo%402x-8.png"></div>`;
    const footer = `<div class="bottom-strip"><span>${esc(s.swipe || "Geser untuk lihat langkah berikutnya")}</span><span class="arrow">⟶</span></div>`;
    const mascot = `<img class="mascot" data-frame="${esc(s.character_frame || "")}" src="file:///D:/ADIT%20KULIAH/LIMAAA/PROJECT/REFO%20-%20GSA/bot_gemini_ub/referensi_design_carousel/brand-assets/Main%20Character.png">`;
    const backdrop = s.background_image
      ? `<div class="generated-backdrop" style="background-image:linear-gradient(180deg,#1115 0%,transparent 42%,#1114 100%),url(&quot;${esc(s.background_image)}&quot;)"></div>`
      : "";
    const ribbon = (text, color) => `<div class="ribbon ${color}">${esc(text)}</div>`;
    const matrix = () => `<section class="slide-matrix">${backdrop}${header}
      <div class="matrix-heading">${ribbon("Solusinya", "yellow")}${ribbon("Matriks Belajar Terstruktur", "green")}</div>
      <div class="matrix-card"><h2>MATRIKS PRIORITAS MINGGUAN</h2><div class="matrix">
        ${s.quadrants.map(q => `<div class="quadrant"><b>${esc(q[0])}</b><span>${esc(q[1])}</span></div>`).join("")}
      </div></div><div class="matrix-note">${esc(s.note)}</div>${footer}</section>`;
    const events = () => s.events.map(e => `<div class="event"><span class="day">${esc(e[0])}</span><span class="time">${esc(e[1])}</span><span class="task">${esc(e[2])}</span></div>`).join("");
    const slidesHtml = {
      cover: () => `<section class="slide-cover">${backdrop}<div class="room-glow"></div>${header}
        ${mascot}<div class="cover-ribbons">${ribbon("Cara buat", "green")}${ribbon("MATRIKS BELAJAR", "blue")}
          <div class="gemini-word"><img src="file:///D:/ADIT%20KULIAH/LIMAAA/PROJECT/REFO%20-%20GSA/bot_gemini_ub/referensi_design_carousel/brand-assets/Gemini%20Icon%402x-8.png">Gemini</div></div>
        <div class="cover-tag">${esc(s.title)}</div>${footer}</section>`,
      problem: () => `<section class="slide-problem">${backdrop}<div class="pattern"></div><div class="wood"></div>${header}${mascot}
        <div class="problem-title">${ribbon("Dilema Mahasiswa", "blue")}${ribbon("Tiap Hari Senin", "coral")}</div>
        <div class="speech left">${esc(s.items[0])}</div><div class="speech right">${esc(s.items[1])}</div>
        <div class="problem-note">${esc(s.note)}</div>${footer}</section>`,
      matrix,
      prompt: () => `<section class="slide-prompt">${backdrop}${header}
        <div class="prompt-heading">${ribbon("Salin & Pakai", "coral")}${ribbon("Prompt Ini di Gemini", "green")}</div>
        <div class="prompt-card">“${esc(s.prompt)}”</div>${mascot}
        <div class="prompt-tip">${esc(s.note)}</div>${footer}</section>`,
      planner: () => `<section class="slide-planner">${backdrop}${header}
        <div class="planner-heading">${ribbon("Biar Nggak Burnout", "blue")}${ribbon("Contoh Jadwal Mingguan", "green")}</div>
        <div class="planner-card"><h2>RENCANA YANG PUNYA RUANG ISTIRAHAT</h2>${events()}</div>${mascot}
        <div class="planner-note">${esc(s.note)}</div>${footer}</section>`,
      closing: () => `<section class="slide-closing">${backdrop}${header}${mascot}
        <div class="closing-heading">${ribbon("Belajar Efektif", "coral")}${ribbon("No Korbanin Waktu Istirahat", "green")}</div>
        <div class="closing-callout">${esc(s.cta)}</div>${footer}</section>`
    };
    root.innerHTML = slidesHtml[s.layout]();
    root.firstElementChild.dataset.art = s.art_direction || "";
    if (s.background_image) root.firstElementChild.classList.add("has-generated-visual");
  </script>
</body>
</html>
